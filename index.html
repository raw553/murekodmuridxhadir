<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kehadiran Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Menggunakan unit yang lebih fleksibel */
    body { font-size: 16px; line-height: 1.5; overflow-x: hidden; }
    
    /* Fokus pada kualiti visual tanpa paksa saiz px yang besar */
    select, input, button { 
      min-height: 50px; 
    }

    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    .animate-fast { animation: fadeIn 0.3s ease-out forwards; }
    
    /* Custom style untuk nampak seperti aplikasi premium */
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body class="bg-emerald-50 font-sans min-h-screen text-emerald-900">

  <audio id="sndSuccess" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
  <audio id="sndDelete" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

  <div class="w-full max-w-md mx-auto pb-20">
    
    <header class="bg-emerald-600 pt-10 pb-12 px-6 rounded-b-[40px] shadow-lg text-center text-white mb-6">
      <h1 class="text-2xl md:text-3xl font-black leading-tight uppercase tracking-tight">
        APLIKASI<br>REKOD TIDAK HADIR
      </h1>
      <div class="w-16 h-1 bg-white/30 mx-auto my-3"></div>
      <p class="text-sm font-bold opacity-90 uppercase">Sekolah Pendidikan Khas Kuantan</p>
    </header>

    <div class="px-4 space-y-6">
      
      <div class="space-y-4">
        
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
          <label class="block text-xs font-black mb-2 uppercase text-emerald-600">1. Tarikh</label>
          <input type="date" id="tarikh" onchange="loadSenarai()" 
                 class="w-full p-3 bg-emerald-50 border-2 border-emerald-200 rounded-xl font-bold text-emerald-800 focus:border-emerald-500 outline-none transition-all">
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
          <label class="block text-xs font-black mb-2 uppercase text-emerald-600">2. Pilih Kelas</label>
          <select id="kelas" onchange="loadMurid(); loadSenarai();" 
                  class="w-full p-3 bg-emerald-50 border-2 border-emerald-200 rounded-xl font-bold text-emerald-800 outline-none">
          </select>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
          <label class="block text-xs font-black mb-2 uppercase text-emerald-600">3. Nama Murid</label>
          <select id="murid" class="w-full p-3 bg-emerald-50 border-2 border-emerald-200 rounded-xl font-bold text-emerald-800 outline-none">
            <option>PILIH KELAS DAHULU</option>
          </select>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
          <label class="block text-xs font-black mb-2 uppercase text-emerald-600">4. Sebab / Alasan</label>
          <select id="alasan" class="w-full p-3 bg-emerald-50 border-2 border-emerald-200 rounded-xl font-bold text-emerald-800 outline-none"></select>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-dashed border-emerald-300 text-center">
          <label class="cursor-pointer block group">
            <span class="text-sm font-black text-emerald-600 block mb-1 group-hover:text-emerald-500">📸 AMBIL GAMBAR MC/DOKUMEN</span>
            <input type="file" id="mc" class="hidden" onchange="document.getElementById('fileNameDisplay').innerText = this.files[0].name">
            <div id="fileNameDisplay" class="text-xs text-gray-400 font-medium italic">Klik di sini untuk muat naik</div>
          </label>
        </div>
      </div>

      <div class="pt-4 space-y-3">
        <button id="btn" onclick="submitForm()" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl text-lg shadow-md active:transform active:scale-95 transition-all uppercase tracking-wider">
          Hantar Rekod
        </button>
        <button onclick="resetBorang(true)" 
                class="w-full text-red-500 text-xs font-bold uppercase tracking-widest py-2 hover:bg-red-50 rounded-lg transition-colors">
          Kosongkan Data
        </button>
      </div>

      <div id="loading" class="hidden text-center text-emerald-600 font-black animate-pulse text-sm uppercase">⏳ Sedang Menghantar...</div>

      <div class="mt-10">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-black text-emerald-900 uppercase text-lg border-b-4 border-emerald-500">Rekod Hari Ini</h3>
          <div id="totalCount" class="text-xs font-black text-white bg-emerald-800 px-3 py-1 rounded-full shadow-sm">0 MURID</div>
        </div>
        <div id="senaraiContainer" class="space-y-4">
          </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-8 px-6">
    <p class="text-[10px] font-bold text-emerald-900/40 uppercase tracking-widest italic">
      Dibangunkan oleh Cikgu Azharuddin Haniff © 2025
    </p>
  </footer>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xs bg-gray-900 text-white p-4 text-sm font-bold text-center rounded-xl shadow-2xl transition-all duration-500 opacity-0 translate-y-20 z-[1000]">
    <span id="toastMsg">MESEJ</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
